<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline' 'self';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KYC-Verify Loading</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: transparent;
        font-family: Inter, Arial, sans-serif;
      }

      .shell {
        width: 100%;
        height: 100vh;
        padding: 22px;
        background:
          radial-gradient(circle at top, rgba(34, 211, 238, 0.2), transparent 32%),
          radial-gradient(circle at 80% 20%, rgba(217, 70, 239, 0.16), transparent 24%),
          linear-gradient(180deg, rgba(2, 6, 23, 0.95), rgba(2, 8, 23, 0.98));
      }

      .panel {
        position: relative;
        display: grid;
        grid-template-columns: 136px 1fr;
        gap: 22px;
        align-items: center;
        width: 100%;
        height: 100%;
        padding: 24px;
        overflow: hidden;
        border-radius: 28px;
        border: 1px solid rgba(34, 211, 238, 0.22);
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 0 80px rgba(34, 211, 238, 0.12);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(56, 189, 248, 0.12) 1px, transparent 1px),
          linear-gradient(90deg, rgba(56, 189, 248, 0.12) 1px, transparent 1px);
        background-size: 88px 88px;
        opacity: 0.15;
        pointer-events: none;
      }

      .art {
        position: relative;
        z-index: 1;
        width: 136px;
        filter: drop-shadow(0 0 24px rgba(34, 211, 238, 0.22));
      }

      .copy {
        position: relative;
        z-index: 1;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 1px solid rgba(34, 211, 238, 0.24);
        background: rgba(34, 211, 238, 0.08);
        color: #bae6fd;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      h1 {
        margin: 16px 0 10px;
        color: #f8fafc;
        font-size: 34px;
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: #94a3b8;
        font-size: 15px;
        line-height: 1.7;
      }

      .status {
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        color: #67e8f9;
        font-size: 13px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #22d3ee;
        box-shadow: 0 0 18px rgba(34, 211, 238, 0.75);
        animation: pulse 1.4s ease-in-out infinite;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(0.9); opacity: 0.7; }
        50% { transform: scale(1.1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="panel">
        <img class="art" src="./assets/preload-screen.png" alt="KYC-Verify shield artwork" />
        <div class="copy">
          <div class="eyebrow">Cyber Desk</div>
          <h1>KYC-Verify</h1>
          <p>
            Spinning up the desktop command center for liveness rehearsal,
            document review, and audit exports.
          </p>
          <div class="status">
            <span class="dot" aria-hidden="true"></span>
            Loading secure session modules…
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
